# Both templates above are forms, so the blank-issue escape hatch stays open for
# anything that fits neither.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/awdr74100/telegram-forwarder/security/advisories/new
    about: Report privately instead. Never in a public issue.

  - name: Something is not forwarding
    url: https://github.com/awdr74100/telegram-forwarder#troubleshooting
    about: Start with `tgfwd doctor` — it names the chat that stopped being reachable.
