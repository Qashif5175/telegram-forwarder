name: Bug report
description: Something behaves differently from what the README says it does.
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Before anything else: **do not paste your `config.toml` or
        `session.json`.** The first holds your API credentials and the second is
        a live login to your Telegram account.

        `tgfwd doctor` and `tgfwd status` are both safe to paste — neither prints
        a credential.

        If this is a security problem, please report it privately instead:
        see [SECURITY.md](https://github.com/awdr74100/telegram-forwarder/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The smallest sequence that shows the problem. If it involves a specific
        kind of message — an album, a poll, a file of a certain type — say so;
        that is usually the whole answer.
      placeholder: |
        1. tgfwd route add, with …
        2. post a … in the source chat
        3. nothing arrives in the target
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `tgfwd --version`.
      placeholder: tgfwd 0.1.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (aarch64)
        - Windows
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: tgfwd doctor
      description: Its output. It prints no credentials.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Run with `-v` for this tool's own debug output, or `-vv` to include the
        Telegram library. Please check it for chat names you would rather not
        publish before pasting.
      render: text
