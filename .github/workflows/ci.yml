name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reading the code is all any of this does; nothing here writes back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One job rather than one per check: every Rust step after the first shares
  # the same compilation, so splitting them across jobs would pay for it again
  # each time. Ordered cheapest first, so a formatting slip fails before
  # anything is built.
  #
  # The steps call `just`, which is also what a developer runs locally. Keeping
  # a second copy of the commands here is how the two drifted apart before:
  # the documented lint did not fail on a warning while this one did.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version and asks for rustfmt and clippy, so
      # rustup installs exactly what the maintainers use and no version is
      # repeated here.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # Prebuilt binaries. Building cargo-shear from source took longer than
      # every check it performs.
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just,cargo-shear,typos

      - run: just fmt
      - run: just lint
      - run: just test
      - run: just unused
      - run: just spell

  # Separate because it is the platforms that are being tested, not the checks:
  # the session file's permissions and the config directory layout both differ
  # on Windows, and building on Linux alone exercises neither.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: just

      - run: just build
