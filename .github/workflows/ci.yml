name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reading the code is all any of this does; nothing here writes back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One job rather than one per check: every Rust step after the first shares
  # the same compilation, so splitting them across jobs would pay for it again
  # each time. Ordered cheapest first, so a formatting slip fails before
  # anything is built.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the version and asks for rustfmt and clippy, so
      # rustup installs exactly what the maintainers use and no version is
      # repeated here.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Format
        run: cargo fmt --all --check

      - uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0

      # Pedantic is enabled in Cargo.toml; warnings are failures here even
      # though they are not locally, so nothing lands half-tidied.
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      # `--locked` doubles as a lock file check: a dependency bumped without
      # committing Cargo.lock fails here rather than drifting. No `--doc` run to
      # accompany it, because `cargo test --doc` errors outright on a crate with
      # no library target, which this binary has not got.
      - name: Test
        run: cargo test --all-targets --locked

      # Four unused dependencies had already accumulated before this was added,
      # including a rate limiter replaced by hand-written code long ago. The
      # compiler cannot see those, so something else has to look.
      - name: Unused dependencies
        run: cargo install cargo-shear --locked && cargo shear

  # Separate because it is the platforms that are being tested, not the checks:
  # the session file's permissions and the config directory layout both differ
  # on Windows, and building on Linux alone exercises neither.
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build
        run: cargo build --release --locked
