name: Actionlint

# The workflows are the one part of the repository that cannot check itself: a
# mistyped `runs-on` label does not fail a run, it queues forever waiting for a
# runner that will never exist, and a workflow too malformed to parse never
# executes at all. Only runs when a workflow actually changes.
on:
  push:
    paths:
      - .github/workflows/**
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # From https://github.com/rhysd/actionlint/blob/main/docs/usage.md#use-actionlint-on-github-actions
      # The image bundles shellcheck, so every `run:` block is linted as shell.
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
