name: Semantic PR

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    name: conventional commit title
    runs-on: ubuntu-latest
    steps:
      # A squash merge takes its message from the pull request title, so the
      # title is what ends up in the history. Checking it here is what keeps
      # `git log` readable without policing individual commits on a branch.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            build
            perf
            style
            revert
          # A subject that restates the type says nothing: "fix: fix the bug".
          subjectPattern: ^(?![A-Z])(?!.*\b(fix|update|change)\b\s*$).+$
          subjectPatternError: |
            The subject "{subject}" is not descriptive enough.

            Start it in lower case and say what changed, not that something did:
              fix: stop losing album members when a forward is refused
            rather than:
              fix: fix bug
