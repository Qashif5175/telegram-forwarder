name: Semantic PR

# Validates that the PR title follows Conventional Commits. With squash merges
# the PR title becomes the commit subject on main, so this is the gate that
# keeps history consistent with the commit convention (CI lints commits at the
# PR-title level, not per-commit).
#
# `pull_request_target` rather than `pull_request` on purpose: the latter takes
# the workflow definition from the fork's branch, so a contributor could edit
# these rules in the same pull request they are meant to constrain.
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] title-only check, no checkout (see below)
    types: [opened, edited, synchronize, reopened]

# Only reads the PR title via the API — no checkout of PR code, so
# pull_request_target is safe here.
permissions:
  pull-requests: read

concurrency:
  group: semantic-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Match the commit-type vocabulary used across the repo.
          types: |
            feat
            fix
            chore
            refactor
            docs
            test
            ci
            build
            perf
            style
            revert
