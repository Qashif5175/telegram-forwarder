# Path-specific exemptions.
#
# `release.yml` is generated by `dist` and regenerated whenever
# `dist-workspace.toml` changes, so anything written into it by hand is lost.
# These two shellcheck findings are in that generated shell and cannot be fixed
# here; they are listed individually rather than skipping the file, so a new
# kind of finding still fails.
paths:
  .github/workflows/release.yml:
    ignore:
      # Unquoted expansion in generated shell. The values come from `dist plan`,
      # which reads the config committed in this repository.
      - 'shellcheck reported issue in this script: SC2086:.+'
      # Style only: consecutive redirects to $GITHUB_OUTPUT that shellcheck
      # would rather see grouped.
      - 'shellcheck reported issue in this script: SC2129:.+'
