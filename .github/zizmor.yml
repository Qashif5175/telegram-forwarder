# Exemptions for `release.yml`, which is generated by `dist` and regenerated
# whenever `dist-workspace.toml` changes — inline `# zizmor: ignore` comments
# would not survive that, so they live here instead.
#
# Scoped to the specific rules below rather than skipping the file: a finding of
# any other kind still fails, which matters because this is the workflow holding
# write access to releases.
rules:
  # `permissions: contents: write` at the workflow level. Creating a GitHub
  # Release needs it, and `dist` does not expose control over the top-level
  # block — only over individual jobs.
  excessive-permissions:
    ignore:
      - release.yml

  # Matrix values and `github.ref_name` interpolated into shell commands. The
  # matrix comes from our own committed config by way of `dist plan`, and
  # `ref_name` on a tag push is the tag — both require push access to influence,
  # which is already enough to change the workflow itself.
  template-injection:
    ignore:
      - release.yml

  # `container: ${{ matrix.container && ... || null }}`. A dormant path: no
  # target here asks for a container, so the expression resolves to null. It
  # would matter if a musl target were added, and this exemption should be
  # revisited then.
  unpinned-images:
    ignore:
      - release.yml
