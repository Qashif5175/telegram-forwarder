# Statically link the C runtime on Windows, so the binary does not need the
# Visual C++ redistributable installed on the machine running it. Without this a
# user who has never installed anything built with MSVC gets a missing-DLL
# dialog instead of a program — which is the opposite of the point of shipping a
# single self-contained executable.
#
# Both `uv` and `ruff` carry the same setting, having hit it in practice:
# https://github.com/astral-sh/ruff/issues/11503
#
# Safe here because nothing in the dependency graph compiles C for Windows: the
# only crate reaching for a C compiler is `iana-time-zone-haiku`, which is
# Haiku-only and never built on this target.
[target.'cfg(all(target_env = "msvc", target_os = "windows"))']
rustflags = ["-C", "target-feature=+crt-static"]
