# Formatting rules for the TOML files in this repository, read by `taplo` and by
# the Even Better TOML extension that embeds it.
#
# Committed for the same reason the `justfile` is: so the result does not depend
# on what each person happens to have configured. Without it, two editors set to
# "format on save" produce two different files.
#
# **`taplo` is in maintenance only.** Its author stepped down in December 2024
# (tamasfe/taplo#715); 0.10.0, from May 2025, is still the newest release, and
# what lands now is build fixes from other people. Chosen anyway, because a
# formatter is the one kind of tool that loses least by being frozen: there is
# no security surface, and output that never changes is the point.
#
# The live alternative is `tombi`, which is what `ratatui` moved to for exactly
# this reason. It was measured against these files and rejected for now — it is
# schema-aware and reorders on that basis, including sorting `package.keywords`
# alphabetically, which is the class of change deliberately switched off below.
# Revisit if the VS Code extension stops working, since it ships from the same
# unmaintained repository.

[formatting]
# 100 rather than the default 80. At 80, a dependency with a single feature —
# `grammers-session` — is split across three lines, which is longer and no
# clearer than the one it replaces.
column_width = 100

# Both default to false; stated because the defaults are load-bearing here.
# `deny.toml`'s licence list is grouped by how permissive each entry is, and
# `dist-workspace.toml` lists targets in the order the release notes read. Sorting
# either alphabetically would destroy information that the comments then describe
# incorrectly.
reorder_keys = false
reorder_arrays = false
